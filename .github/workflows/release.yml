name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 任一平台失败时，已成功的产物仍然完整发布；不要让一个平台的瞬时
      # 故障（公证服务器抖动、staple 失败等）牵连整个 release 的完整性。
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup uv for the bundled tfbash runtime
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Prepare and verify offline tfbash runtime
        run: pnpm runtime:prepare:tfbash -- ${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          # Apple code-signing + notarization (macOS only; ignored on other platforms).
          # tauri-action 自动检测这组变量，创建临时 keychain → 签名 → 公证 → staple。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'TFRobot Client v__VERSION__'
          releaseBody: |
            See CHANGELOG.md for details.

            ## 安装

            - **macOS**：下载 `.dmg`，双击挂载后将应用拖入 Applications 即可。已通过 Apple 公证，无需任何额外命令。
            - **Windows**：下载 `.msi` 或 `.exe` 安装包并运行。
            - **Linux**：下载 `.AppImage` 或 `.deb`。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # tauri-action 只把 .app 提交给 notarytool 公证，.dmg 容器从未公证 → stapler
      # 拿 .dmg 的 hash 在 Apple CloudKit 上查不到 ticket。这里单独把 .dmg 公证 + staple。
      # NOTE: Tauri 产出的 dmg 文件名带空格（"TFRobot Client_x.y.z_*.dmg"），
      #       全程用 -print0 / xargs -0 处理，避免 shell word-splitting。
      - name: Notarize DMG, staple and re-upload (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DMG_COUNT=$(find src-tauri/target -name "*.dmg" -type f | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "::warning::No DMG found, skipping notarize"
            exit 0
          fi
          echo "Found $DMG_COUNT DMG(s) to notarize."
          find src-tauri/target -name "*.dmg" -type f -print0 \
            | xargs -0 -I{} sh -c '
                set -e
                echo "::group::Notarize $1"
                xcrun notarytool submit "$1" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" \
                  --wait --timeout 600
                xcrun stapler staple "$1"
                xcrun stapler validate "$1"
                echo "::endgroup::"
              ' _ {}
          find src-tauri/target -name "*.dmg" -type f -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
