name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          # Apple code-signing + notarization (macOS only; ignored on other platforms).
          # tauri-action 自动检测这组变量，创建临时 keychain → 签名 → 公证 → staple。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'TFRobot Client v__VERSION__'
          releaseBody: |
            See CHANGELOG.md for details.

            ## 安装

            - **macOS**：下载 `.dmg`，双击挂载后将应用拖入 Applications 即可。已通过 Apple 公证，无需任何额外命令。
            - **Windows**：下载 `.msi` 或 `.exe` 安装包并运行。
            - **Linux**：下载 `.AppImage` 或 `.deb`。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # tauri-action 会 staple .app 但漏 staple .dmg 容器；这里补上并覆盖 release 资产。
      # spctl -a -t open 在 quarantine .dmg 上之前会判 Unnotarized Developer ID，订上票后即 Notarized。
      - name: Staple DMG and re-upload (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DMGS=$(find src-tauri/target -name "*.dmg" -type f)
          if [ -z "$DMGS" ]; then
            echo "::warning::No DMG found, skipping staple"
            exit 0
          fi
          for dmg in $DMGS; do
            echo "Stapling: $dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          # shellcheck disable=SC2086
          gh release upload "${{ github.ref_name }}" $DMGS --clobber
