name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # tauri-action merges latest.json with the existing release manifest.
      # Serialize matrix jobs so concurrent uploads cannot drop another target.
      max-parallel: 1
      # 任一平台失败时，已成功的产物仍然完整发布；不要让一个平台的瞬时
      # 故障（公证服务器抖动、staple 失败等）牵连整个 release 的完整性。
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup uv for the bundled tfbash runtime
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Prepare and verify offline tfbash runtime
        run: pnpm runtime:prepare:tfbash -- ${{ matrix.target }}

      # The bundled Python runtime contains native Mach-O executables, extension
      # modules and dylibs. Tauri signs the outer app bundle, but Apple notarization
      # also requires every nested native binary to carry its own Developer ID
      # signature and secure timestamp.
      - name: Import Apple code-signing certificate (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled tfbash native binaries (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          RUNTIME_ROOT="src-tauri/resources/tfbash/${{ matrix.target }}"
          SIGNED_COUNT=0
          while IFS= read -r -d '' CANDIDATE; do
            if file -b "$CANDIDATE" | grep -q '^Mach-O'; then
              codesign --force --timestamp --options runtime \
                --sign "$APPLE_SIGNING_IDENTITY" "$CANDIDATE"
              codesign --verify --strict --verbose=2 "$CANDIDATE"
              SIGNED_COUNT=$((SIGNED_COUNT + 1))
            fi
          done < <(find "$RUNTIME_ROOT" -type f -print0)
          if [ "$SIGNED_COUNT" -eq 0 ]; then
            echo "::error::No Mach-O files found under $RUNTIME_ROOT"
            exit 1
          fi
          echo "Signed and verified $SIGNED_COUNT bundled Mach-O files."
          pnpm runtime:prepare:tfbash -- "${{ matrix.target }}" --refresh-manifest

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          # Apple code-signing + notarization (macOS only; ignored on other platforms).
          # 证书由上面的 Apple Action 导入；Tauri 使用 identity 签名并自动公证应用。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'TFRobot Client v__VERSION__'
          releaseBody: |
            See CHANGELOG.md for details.

            ## 安装

            - **macOS**：下载 `.dmg`，双击挂载后将应用拖入 Applications 即可。已通过 Apple 公证，无需任何额外命令。
            - **Windows**：下载 `.msi` 或 `.exe` 安装包并运行。
            - **Linux**：下载 `.AppImage`（支持自动更新）、`.deb` 或 `.rpm` 安装包。
          # Keep the release private until every matrix target and latest.json
          # have passed the integrity gate below.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # tauri-action 只把 .app 提交给 notarytool 公证，.dmg 容器从未公证 → stapler
      # 拿 .dmg 的 hash 在 Apple CloudKit 上查不到 ticket。这里单独把 .dmg 公证 + staple。
      # NOTE: Tauri 产出的 dmg 文件名带空格（"TFRobot Client_x.y.z_*.dmg"），
      #       全程用 -print0 / xargs -0 处理，避免 shell word-splitting。
      - name: Notarize DMG, staple and re-upload (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DMG_COUNT=$(find src-tauri/target -name "*.dmg" -type f | wc -l | tr -d ' ')
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "::warning::No DMG found, skipping notarize"
            exit 0
          fi
          echo "Found $DMG_COUNT DMG(s) to notarize."
          find src-tauri/target -name "*.dmg" -type f -print0 \
            | xargs -0 -I{} sh -c '
                set -e
                echo "::group::Notarize $1"
                xcrun notarytool submit "$1" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" \
                  --wait --timeout 600
                xcrun stapler staple "$1"
                xcrun stapler validate "$1"
                echo "::endgroup::"
              ' _ {}
          find src-tauri/target -name "*.dmg" -type f -print0 \
            | xargs -0 gh release upload "$TAG" --clobber

  verify-updater-release:
    name: Verify updater manifest and signatures
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets_json="$(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets')"
          assets="$(jq -r '.[].name' <<<"$assets_json")"
          grep -Fx 'latest.json' <<<"$assets"
          grep -Eq '\.dmg$' <<<"$assets"
          grep -Eq '\.msi$' <<<"$assets"
          grep -Eq '\.AppImage$' <<<"$assets"
          grep -Eq '\.deb$' <<<"$assets"
          signature_count="$(grep -Ec '\.sig$' <<<"$assets" || true)"
          if [ "$signature_count" -lt 4 ]; then
            echo "Expected signed updater artifacts for all release targets; found $signature_count .sig files."
            exit 1
          fi
          gh release download "$TAG" --repo "$REPOSITORY" --pattern latest.json --output "$RUNNER_TEMP/latest.json"
          jq -e '
            (.version | type == "string" and length > 0)
            and (.platforms | type == "object" and length >= 4)
            and all(.platforms[]; (.url | type == "string" and length > 0)
              and (.signature | type == "string" and length > 0))
          ' "$RUNNER_TEMP/latest.json" >/dev/null
          while IFS= read -r url; do
            asset_id="${url##*/}"
            asset_id="${asset_id%%\?*}"
            asset_name="$(jq -r --arg id "$asset_id" --arg url "$url" \
              '.[] | select((.id | tostring) == $id or .name == $id or .url == $url or .browserDownloadUrl == $url) | .name' \
              <<<"$assets_json" | head -n 1)"
            if [ -z "$asset_name" ] || [ "$asset_name" = "null" ]; then
              echo "Manifest URL does not reference a release asset: $url"
              exit 1
            fi
            grep -Fx "$asset_name" <<<"$assets"
            grep -Fx "$asset_name.sig" <<<"$assets"
          done < <(jq -r '.platforms[] | .url' "$RUNNER_TEMP/latest.json")

  publish-release:
    name: Publish verified release
    needs: verify-updater-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
