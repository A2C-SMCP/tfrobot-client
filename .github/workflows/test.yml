name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: test-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════
  # Lint & Format (tsc + eslint + rustfmt + clippy)
  # ══════════════════════════════════════════
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # clippy 需要编译 tauri lib，Linux 下依赖系统库
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile
      # Tauri's generate_context! validates frontendDist while clippy compiles
      # the Rust library, so a clean checkout must build the frontend first.
      - run: pnpm build

      # Rust 格式（只检查不改文件）
      - run: pnpm fmt:check

      # 与本地一致：tsc --noEmit + eslint + clippy -D warnings
      - run: pnpm lint

  # ══════════════════════════════════════════
  # Frontend Tests (Ubuntu, fastest)
  # ══════════════════════════════════════════
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: frontend
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # ══════════════════════════════════════════
  # Rust Tests (three-platform matrix)
  # ══════════════════════════════════════════
  rust-test:
    name: Rust Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: system dependencies + Keychain emulation
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            gnome-keyring \
            dbus-x11
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "test-password" | gnome-keyring-daemon --unlock --daemonize

      # Node.js needed for echo MCP server integration tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build frontend for tauri build context
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Verify Rust SDK registry source
        run: pnpm verify:a2c-smcp-source

      - name: Run tests
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo test

      # GitHub's Windows runner PATH can contain JDK-provided api-ms-win DLL
      # forwarders. They shadow the operating system API-set mapping and make
      # Rust test harnesses abort before main with STATUS_ENTRYPOINT_NOT_FOUND.
      # Tauri/WebView2 test harnesses also need Common Controls v6 activated;
      # embed that manifest post-link so the application build keeps Tauri's
      # single manifest and does not hit CVT1100 duplicate-resource failures.
      - name: Run tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $separator = [IO.Path]::PathSeparator
          $dropped = [System.Collections.Generic.List[string]]::new()
          $kept = foreach ($directory in ($env:Path -split $separator)) {
            if (-not $directory) {
              continue
            }
            $shipsApiSet = $false
            if (Test-Path -LiteralPath $directory -PathType Container -ErrorAction SilentlyContinue) {
              $shipsApiSet = [bool](
                Get-ChildItem -LiteralPath $directory -Filter 'api-ms-win-*.dll' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              )
            }
            if ($shipsApiSet) {
              [void]$dropped.Add($directory)
              continue
            }
            $directory
          }

          if ($dropped.Count) {
            Write-Host 'Dropping PATH entries that ship api-ms-win-*.dll:'
            foreach ($directory in $dropped) {
              Write-Host "  - $directory"
            }
            $env:Path = ($kept -join $separator)
          } else {
            Write-Host 'No PATH entry ships api-ms-win-*.dll'
          }

          Write-Host '=== cargo test --no-run ==='
          $cargoMessages = @(& cargo test --no-run --message-format=json-render-diagnostics)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $testExecutables = @(
            $cargoMessages |
              ForEach-Object {
                try {
                  $message = $_ | ConvertFrom-Json -ErrorAction Stop
                  if (
                    $message.reason -eq 'compiler-artifact' -and
                    $message.profile.test -eq $true -and
                    $message.executable
                  ) {
                    $message.executable
                  }
                } catch {
                  # Cargo diagnostics can be rendered alongside JSON messages.
                }
              } |
              Sort-Object -Unique
          )
          if (-not $testExecutables.Count) {
            throw 'cargo did not report any Windows test executable'
          }

          $mt = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            $candidates = @(
              @(
                & $vswhere -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\mt.exe' 2>$null
                & $vswhere -latest -find 'VC\Tools\MSVC\*\bin\HostX64\x64\mt.exe' 2>$null
                & $vswhere -latest -find '**\mt.exe' 2>$null
              ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
            )
            if ($candidates.Count) {
              $mt = $candidates[0]
            }
          }
          if (-not $mt) {
            $kitRoots = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'),
              (Join-Path $env:ProgramFiles 'Windows Kits\10\bin')
            )
            foreach ($root in $kitRoots) {
              if (-not (Test-Path -LiteralPath $root)) {
                continue
              }
              $hit = Get-ChildItem -Path $root -Recurse -Filter 'mt.exe' -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
                Select-Object -First 1
              if ($hit) {
                $mt = $hit.FullName
                break
              }
            }
          }
          if (-not $mt) {
            $command = Get-Command mt.exe -ErrorAction SilentlyContinue
            if ($command) {
              $mt = $command.Source
            }
          }
          if (-not $mt) {
            throw 'mt.exe not found; cannot embed the Windows test manifest'
          }
          Write-Host "mt.exe: $mt"

          $manifest = Join-Path (Get-Location) 'windows-test-manifest.xml'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "missing Windows test manifest: $manifest"
          }

          foreach ($executable in $testExecutables) {
            Write-Host "Embedding Common Controls v6 manifest into $executable"
            & $mt -nologo -manifest $manifest "-outputresource:$executable;#1"
            if ($LASTEXITCODE -ne 0) {
              throw "mt.exe failed for $executable (exit $LASTEXITCODE)"
            }
          }

          Write-Host '=== run Windows test executables ==='
          $failed = $false
          foreach ($executable in $testExecutables) {
            Write-Host ">> $executable"
            & $executable
            if ($LASTEXITCODE -ne 0) {
              Write-Host "test executable failed: $executable (exit $LASTEXITCODE)"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      # Coverage only on Linux (avoid duplication)
      - name: Generate coverage
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo install cargo-tarpaulin --locked
          cargo tarpaulin --out xml --output-dir ../coverage

      - uses: codecov/codecov-action@v4
        if: runner.os == 'Linux' && always()
        with:
          flags: rust
          files: coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # ══════════════════════════════════════════
  # E2E Tests (Playwright)
  # ══════════════════════════════════════════
  e2e-test:
    name: E2E Tests
    needs: [frontend-test, rust-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════
  # Smoke Tests — disabled: tauri-driver only supports Linux,
  # re-enable when Tauri provides macOS WebDriver support.
  # ══════════════════════════════════════════

  # ══════════════════════════════════════════
  # Quality Gate
  # ══════════════════════════════════════════
  quality-gate:
    name: Quality Gate
    needs: [lint, frontend-test, rust-test, e2e-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.rust-test.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-test.result }}" != "success" ]]; then
            echo "Some test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
