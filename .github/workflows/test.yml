name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════
  # Frontend Tests (Ubuntu, fastest)
  # ══════════════════════════════════════════
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: frontend
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # ══════════════════════════════════════════
  # Rust Tests (three-platform matrix)
  # ══════════════════════════════════════════
  rust-test:
    name: Rust Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: system dependencies + Keychain emulation
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            gnome-keyring \
            dbus-x11
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "test-password" | gnome-keyring-daemon --unlock --daemonize

      # Node.js needed for echo MCP server integration tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build frontend for tauri build context
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      # Coverage only on Linux (avoid duplication)
      - name: Generate coverage
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo install cargo-tarpaulin --locked
          cargo tarpaulin --out xml --output-dir ../coverage

      - uses: codecov/codecov-action@v4
        if: runner.os == 'Linux' && always()
        with:
          flags: rust
          files: coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # ══════════════════════════════════════════
  # E2E Tests (Playwright)
  # ══════════════════════════════════════════
  e2e-test:
    name: E2E Tests
    needs: [frontend-test, rust-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════
  # Smoke Tests (Tauri Driver, macOS only)
  # ══════════════════════════════════════════
  smoke-test:
    name: Smoke Test (macOS)
    needs: [frontend-test, rust-test, e2e-test]
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Build release
      - run: pnpm tauri build

      # Install tauri-driver
      - run: cargo install tauri-driver

      # Start tauri-driver in background and run smoke tests
      - run: |
          tauri-driver &
          sleep 2
          pnpm test:smoke
        timeout-minutes: 5

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-screenshots
          path: e2e/smoke/screenshots/
          retention-days: 7

  # ══════════════════════════════════════════
  # Quality Gate
  # ══════════════════════════════════════════
  quality-gate:
    name: Quality Gate
    needs: [frontend-test, rust-test, e2e-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.rust-test.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-test.result }}" != "success" ]]; then
            echo "Some test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
