name: Release 0.3.0 diagnostics

on:
  push:
    branches: [diag/release-030-20261019]

permissions:
  contents: read

jobs:
  signing-inputs:
    if: false # Captured in diagnostic run 39194001870; repeat only the Linux probe.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - name: Check updater inputs without exposing values
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: node scripts/diagnose-release-signing.mjs

  apple-service:
    if: false # Captured in diagnostic run 39194001870; repeat only the Linux probe.
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Query notarization history without submitting an application
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('xcrun', [
            'notarytool', 'history', '--apple-id', process.env.APPLE_ID,
            '--password', process.env.APPLE_PASSWORD, '--team-id', process.env.APPLE_TEAM_ID,
            '--output-format', 'json',
          ], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          const response = `${result.stdout ?? ''}\n${result.stderr ?? ''}`;
          console.log(JSON.stringify({
            checkedAt: new Date().toISOString(),
            operation: 'notarytool history (read only)',
            exitStatus: result.status,
            accepted: result.status === 0,
            http403: /403/.test(response),
            agreementRequired: /required agreement|agreement.*expired|agreement.*signed/i.test(response),
            credentialRejected: /401|Invalid credentials|authentication failed/i.test(response),
          }));
          JS

  linux-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Match release system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:prepare:tfbash -- x86_64-unknown-linux-gnu
      - name: Stage previously released binary and identical runtime for packaging-only probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.5 --repo A2C-SMCP/tfrobot-client --pattern '*amd64.deb' --dir "$RUNNER_TEMP/prior-release"
          prior_deb=$(find "$RUNNER_TEMP/prior-release" -name '*.deb' -type f -print -quit)
          dpkg-deb -x "$prior_deb" "$RUNNER_TEMP/prior-root"
          prior_binary=$(find "$RUNNER_TEMP/prior-root" -type f -path '*/usr/bin/tfrobot-client' -print -quit)
          test -n "$prior_binary"
          mkdir -p src-tauri/target/x86_64-unknown-linux-gnu/release dist
          cp "$prior_binary" src-tauri/target/x86_64-unknown-linux-gnu/release/tfrobot-client
          node scripts/prepare-tfbash-runtime.mjs x86_64-unknown-linux-gnu --verify
          echo 'Packaging-only control: v0.2.5 published binary, v0.3.0 bundle configuration, identical runtime; updater signing disabled.'
      - name: Compare default strip and NO_STRIP with verbose logs
        run: |
          set +e
          pnpm exec tauri bundle --target x86_64-unknown-linux-gnu --bundles appimage --no-sign --verbose > "$RUNNER_TEMP/appimage-default.log" 2>&1
          default_status=$?
          echo "Default strip exit status: $default_status"
          tail -100 "$RUNNER_TEMP/appimage-default.log"
          NO_STRIP=true pnpm exec tauri bundle --target x86_64-unknown-linux-gnu --bundles appimage --no-sign --verbose > "$RUNNER_TEMP/appimage-no-strip.log" 2>&1
          no_strip_status=$?
          echo "NO_STRIP exit status: $no_strip_status"
          tail -100 "$RUNNER_TEMP/appimage-no-strip.log"
          printf '{"defaultExitStatus":%s,"noStripExitStatus":%s}\n' "$default_status" "$no_strip_status" > "$RUNNER_TEMP/appimage-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-diagnostic-logs
          path: |
            ${{ runner.temp }}/appimage-default.log
            ${{ runner.temp }}/appimage-no-strip.log
            ${{ runner.temp }}/appimage-results.json
          retention-days: 7
