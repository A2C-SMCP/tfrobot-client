name: Release 0.3.0 diagnostics

on:
  push:
    branches: [diag/release-030-20261019]

permissions:
  contents: read

jobs:
  signing-inputs:
    if: false # Original-key recoverability established on all three operating systems.

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - name: Check original updater credentials with the patched CLI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: node scripts/diagnose-original-key-recoverability.mjs

  repair-original-key:
    if: false # Original encoding repaired and verified across all three operating systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get install -y libsodium23
      - name: Repair original key encoding without changing its public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          TFROBOT_SEALED_SECRET_OUTPUT: ${{ runner.temp }}/repaired-secret-payload.json
          PYTHONOPTIMIZE: "1"
        run: node scripts/repair-original-updater-key.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-original-key-repair
          path: ${{ runner.temp }}/repaired-secret-payload.json
          retention-days: 1
          if-no-files-found: error

  apple-service:

    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Query notarization history without submitting an application
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const result = spawnSync('xcrun', [
            'notarytool', 'history', '--apple-id', process.env.APPLE_ID,
            '--password', process.env.APPLE_PASSWORD, '--team-id', process.env.APPLE_TEAM_ID,
            '--output-format', 'json',
          ], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          const response = `${result.stdout ?? ''}\n${result.stderr ?? ''}`;
          console.log(JSON.stringify({
            checkedAt: new Date().toISOString(),
            matchesBrowserTeam: process.env.APPLE_TEAM_ID === '65MA8GS98T',
            matchesBrowserAccount: createHash('sha256').update((process.env.APPLE_ID ?? '').trim().toLowerCase()).digest('hex') === '2d7345dbbb8d93768c635bd19bf893b1bc345a9bf2e4a0154597ce61dd9608ba',
            operation: 'notarytool history (read only)',
            exitStatus: result.status,
            accepted: result.status === 0,
            http403: /403/.test(response),
            agreementRequired: /required agreement|agreement.*expired|agreement.*signed/i.test(response),
            credentialRejected: /401|Invalid credentials|authentication failed/i.test(response),
          }));
          process.exitCode = result.status === 0 ? 0 : 1;
          JS

  linux-bundle:
    if: false # Linux packaging and installed runtime have already been verified.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:prepare:tfbash -- x86_64-unknown-linux-gnu
      - name: Stage published binary as a packaging control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.5 --repo A2C-SMCP/tfrobot-client --pattern '*amd64.deb' --dir "$RUNNER_TEMP/prior-release"
          prior_deb=$(find "$RUNNER_TEMP/prior-release" -name '*.deb' -type f -print -quit)
          dpkg-deb -x "$prior_deb" "$RUNNER_TEMP/prior-root"
          prior_binary=$(find "$RUNNER_TEMP/prior-root" -type f -path '*/usr/bin/tfrobot-client' -print -quit)
          test -n "$prior_binary"
          mkdir -p src-tauri/target/x86_64-unknown-linux-gnu/release dist
          cp "$prior_binary" src-tauri/target/x86_64-unknown-linux-gnu/release/tfrobot-client
      - name: Package fixed runtime for installed-interpreter smoke check
        env:
          TFROBOT_OFFICIAL_RELEASE: "1"
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/src-tauri/resources/tfbash/x86_64-unknown-linux-gnu/python/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pnpm exec tauri bundle --target x86_64-unknown-linux-gnu --bundles appimage --no-sign --verbose > "$RUNNER_TEMP/linux-packaging.log" 2>&1
      - name: Verify runtime in the actual packaged AppImage
        run: |
          APPIMAGE_PATH=$(find "$GITHUB_WORKSPACE/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          test -n "$APPIMAGE_PATH"
          EXTRACT_DIR="$RUNNER_TEMP/verify-appimage-runtime"
          mkdir -p "$EXTRACT_DIR"
          (cd "$EXTRACT_DIR" && "$APPIMAGE_PATH" --appimage-extract > /dev/null)
          RUNTIME_MANIFEST=$(find "$EXTRACT_DIR/squashfs-root" -path '*/tfbash/x86_64-unknown-linux-gnu/runtime-manifest.json' -type f -print -quit)
          test -n "$RUNTIME_MANIFEST"
          RUNTIME_PYTHON="$(dirname "$RUNTIME_MANIFEST")/python/bin/python3"
          # The preparation hash is a cache identity, not an installed-runtime
          # invariant: linuxdeploy legitimately patches ELF rpaths. Exercise the
          # packaged interpreter without access to the build's library path.
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH "$RUNTIME_PYTHON" -I -B -c '
          import json, platform, sys, tfbash_mcp
          from importlib.metadata import version
          manifest = json.load(open(sys.argv[1]))
          assert platform.python_version() == manifest["python"]["version"]
          assert version("tfbash-mcp") == manifest["tfbashMcp"]["version"]
          print("Packaged Python and tfbash imports verified")
          ' "$RUNTIME_MANIFEST"
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH "$RUNTIME_PYTHON" -I -B -m tfbash_mcp --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-linux-packaging-log
          path: ${{ runner.temp }}/linux-packaging.log
          retention-days: 7
