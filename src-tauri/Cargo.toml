[package]
name = "tfrobot-client"
version = "0.1.0"
edition = "2021"
description = "TFRobot Client - A2C-SMCP Computer GUI"
authors = ["TFRobot Team"]
license = "MIT"

[lib]
name = "tfrobot_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# A2C-SMCP Computer implementation
smcp-computer = "0.1.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tauri-plugin-log = "2"
log = "0.4"

# Cross-platform keychain
keyring = "3"

# Error handling
thiserror = "2"
anyhow = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# SQLite for log storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Runtime path detection
which = "7"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "benchmarks"
harness = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
