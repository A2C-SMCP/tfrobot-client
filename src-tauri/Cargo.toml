[package]
name = "tfrobot-client"
version = "0.1.3"
edition = "2021"
description = "TFRobot Client - A2C-SMCP Computer GUI"
authors = ["TFRobot Team"]
license = "MIT"

[lib]
name = "tfrobot_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# A2C-SMCP Computer implementation
smcp-computer = "0.2.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tauri-plugin-log = "2"
log = "0.4"

# Cross-platform keychain
keyring = "3"

# Error handling
thiserror = "2"
anyhow = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# SQLite for log storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Runtime path detection
which = "7"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-single-instance = "2"
dirs = "6.0.0"

# HTTP client for TFRSManager REST APIs (rustls to avoid OpenSSL dep)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Hashing for keychain key derivation (base_url → stable short hash)
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
criterion = { version = "0.5", features = ["async_tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "full"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "full"] }
socketioxide = { version = "0.16.3", features = ["state"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "benchmarks"
harness = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enable TFRM-16 acceptance tests against smcp-computer >= 0.2.2.
# See docs/proposals/tfrm-16-rust-sdk-handshake-config.md.
verify-smcp-0-2-2 = []
